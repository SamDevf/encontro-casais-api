spring.application.name=encontro-casais-api

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/encontro_casais}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Mercado Pago Integracao
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# Janela para evitar inscrições duplicadas
inscricao.duplicidade.janela-minutos=${INSCRICAO_DUPLICIDADE_JANELA_MINUTOS:30}

# Configurações de E-mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
organizador.email=${ORGANIZADOR_EMAIL:}